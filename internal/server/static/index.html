<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperture · access control</title>
    <!--
      Vendored, committed pre-built blobs (no node build). See vendor/README.md
      for versions + regeneration. styles.css is the authoritative styling;
      Tailwind/DaisyUI are available to later domain screens.
    -->
    <link rel="stylesheet" href="/css/styles.css" />
    <script defer src="/js/app.js"></script>
    <script defer src="/js/crud.js"></script>
    <script defer src="/js/grants.js"></script>
    <script defer src="/js/audit.js"></script>
    <script defer src="/js/whatif.js"></script>
    <script defer src="/js/portability.js"></script>
    <script defer src="/js/rules-serializer.js"></script>
    <script defer src="/js/rules.js"></script>
    <script defer src="/js/graph.js"></script>
    <script defer src="/vendor/alpine.min.js"></script>
  </head>
  <body>
    <!--
      Lucide icon sprite (stroke-only, 1.5px per §7). Inlined so the binary
      stays self-contained — no icon CDN, no icon JS. Add symbols here as the nav
      grows; reference with <use href="#icon-…">.
    -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <symbol id="icon-aperture" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <line x1="14.31" x2="20.05" y1="8" y2="17.94" />
            <line x1="9.69" x2="21.17" y1="8" y2="8" />
            <line x1="7.38" x2="13.12" y1="12" y2="2.06" />
            <line x1="9.69" x2="3.95" y1="16" y2="6.06" />
            <line x1="14.31" x2="2.83" y1="16" y2="16" />
            <line x1="16.62" x2="10.88" y1="12" y2="21.94" />
          </symbol>
          <symbol id="icon-crud" viewBox="0 0 24 24">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
            <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
            <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
          </symbol>
          <symbol id="icon-grants" viewBox="0 0 24 24">
            <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 0 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" />
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
          </symbol>
          <symbol id="icon-audit" viewBox="0 0 24 24">
            <path d="M15 12h-5" />
            <path d="M15 8h-5" />
            <path d="M19 17V5a2 2 0 0 0-2-2H4" />
            <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3" />
          </symbol>
          <symbol id="icon-rules" viewBox="0 0 24 24">
            <rect width="8" height="8" x="3" y="3" rx="2" />
            <path d="M7 11v4a2 2 0 0 0 2 2h4" />
            <rect width="8" height="8" x="13" y="13" rx="2" />
          </symbol>
          <symbol id="icon-whatif" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </symbol>
          <symbol id="icon-portability" viewBox="0 0 24 24">
            <path d="M12 3v12" />
            <path d="m8 11 4 4 4-4" />
            <path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4" />
          </symbol>
          <symbol id="icon-graph" viewBox="0 0 24 24">
            <circle cx="5" cy="6" r="2.5" />
            <circle cx="19" cy="6" r="2.5" />
            <circle cx="12" cy="18" r="2.5" />
            <path d="M7 7.2 10.4 16M17 7.2 13.6 16M7.4 6h9.2" />
          </symbol>
        </g>
      </defs>
    </svg>

    <div x-data="shell()" x-cloak>
      <div class="shell">
        <!-- Fixed left sidebar (~232px) -->
        <aside class="shell__sidebar">
          <div class="shell__brand">
            <span class="shell__brand-mark">
              <svg width="14" height="14"><use href="#icon-aperture" /></svg>
            </span>
            <span class="shell__wordmark">Aperture</span>
          </div>
          <nav class="shell__nav">
            <div class="shell__nav-group">
              <div class="shell__nav-heading">Access control</div>
              <template x-for="section in sections" :key="section.id">
                <a
                  class="a-nav-item"
                  :class="{ 'a-nav-item--active': active === section.id }"
                  :href="section.route"
                >
                  <svg><use :href="'#icon-' + section.id" /></svg>
                  <span x-text="section.label"></span>
                </a>
              </template>
            </div>
          </nav>
        </aside>

        <!-- Top utility bar (~52px) -->
        <header class="shell__topbar">
          <span class="shell__topbar-title" x-text="activeSection.label"></span>
          <div class="shell__topbar-spacer"></div>
          <template x-if="signedIn">
            <div class="shell__identity">
              <span>Signed in as</span>
              <span class="shell__identity-id" x-text="principal"></span>
              <button class="a-btn a-btn--secondary" @click="signOut()">Sign out</button>
            </div>
          </template>
        </header>

        <!-- Flex content area. The Model (crud) section is filled by E6-S2; the
             other sections keep the shell placeholder until their story lands. -->
        <main class="shell__content">
          <!-- Model management (E6-S2): principals, roles, groups, permissions,
               object types + their typed action sets. Its own Alpine scope. -->
          <div x-show="active === 'crud'" x-data="crud()">
            <div class="a-section-head">
              <h1 class="a-h3">Model</h1>
              <span class="a-caption" x-show="account">
                Account <span class="a-mono" x-text="account"></span>
              </span>
            </div>

            <!-- Not signed in: factual gate, no editing surface. -->
            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to manage the model.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <!-- Tier gate: read-only viewers are told why editing is hidden. -->
                <template x-if="tierChecked && !canEdit">
                  <div class="a-alert a-alert--info">
                    <span>
                      You are signed in as <span class="a-mono" x-text="principal"></span>.
                      Editing the model requires system-admin authority; you have read-only access.
                    </span>
                  </div>
                </template>

                <div class="a-toolbar">
                  <div class="a-tabs">
                    <template x-for="t in types" :key="t.key">
                      <button
                        class="a-tab"
                        :class="{ 'a-tab--active': activeType === t.key }"
                        @click="selectType(t.key)"
                        x-text="t.label"
                      ></button>
                    </template>
                  </div>
                  <div class="a-toolbar__spacer"></div>
                  <button class="a-btn a-btn--secondary" @click="addFilter()">Add filter</button>
                  <button class="a-btn a-btn--secondary" @click="load()">Reload</button>
                  <!-- Two independent gates, rendered differently on purpose
                       (see "locked controls" in crud.js): a non-admin gets no
                       button at all (x-show on the wrapper), while an entity
                       kind this DEPLOYMENT does not manage keeps its button,
                       disabled, with the reason on hover. The title sits on the
                       wrapper because a disabled .a-btn has pointer-events:
                       none and would never show one of its own. -->
                  <span class="a-locked" x-show="canEdit" :title="lockHint(currentType)">
                    <button
                      class="a-btn a-btn--primary"
                      :disabled="!entityManaged(currentType)"
                      @click="openCreate()"
                      x-text="'New ' + currentType.singular"
                    ></button>
                  </span>
                </div>

                <!-- Server-side filter bar: each row is a predicate sent to the
                     List RPC so the SERVER returns only matching entities. -->
                <div class="a-filterbar" x-show="filters.length > 0">
                  <div class="a-filterbar__match">
                    <span class="a-caption">Match</span>
                    <select class="a-select" style="width:auto" x-model="filterMatch" @change="load()">
                      <option value="all">all</option>
                      <option value="any">any</option>
                    </select>
                    <span class="a-caption">of:</span>
                  </div>
                  <template x-for="(f, i) in filters" :key="i">
                    <div class="a-filterrow">
                      <select class="a-select" x-model="f.field" @change="load()">
                        <template x-for="col in currentType.columns" :key="col.key">
                          <option :value="col.key" x-text="col.label"></option>
                        </template>
                      </select>
                      <select class="a-select" style="width:auto" x-model="f.op" @change="load()">
                        <option value="contains">contains</option>
                        <option value="eq">equals</option>
                        <option value="starts">starts with</option>
                        <option value="empty">is empty</option>
                      </select>
                      <input class="a-input" style="width:150px" x-model="f.value"
                             x-show="filterNeedsValue(f.op)"
                             placeholder="value" @keydown.enter="load()" @blur="load()" />
                      <button class="a-iconbtn" title="Remove" @click="removeFilter(i)">✕</button>
                    </div>
                  </template>
                  <button class="a-btn a-btn--secondary" @click="addFilter()">+ condition</button>
                  <button class="a-btn a-btn--secondary" @click="clearFilters(); load()">Clear</button>
                </div>

                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>

                <template x-if="loading">
                  <p class="a-body a-muted">Loading.</p>
                </template>

                <template x-if="!loading && !error && rows.length === 0">
                  <div class="a-empty">
                    <p class="a-body" x-text="emptyText()"></p>
                  </div>
                </template>

                <template x-if="!loading && rows.length > 0">
                  <div class="a-table-wrap">
                    <table class="a-table">
                      <thead>
                        <tr>
                          <template x-for="col in currentType.columns" :key="col.key">
                            <th x-text="col.label"></th>
                          </template>
                          <th style="text-align: right">Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="row in rows" :key="rowId(row)">
                          <tr>
                            <template x-for="col in currentType.columns" :key="col.key">
                              <td :class="col.mono ? 'a-cell-mono' : ''">
                                <template x-if="col.badge">
                                  <span
                                    class="a-badge"
                                    :class="'a-badge--' + String(row[col.key] || '').toLowerCase()"
                                    x-text="row[col.key] || '—'"
                                  ></span>
                                </template>
                                <template x-if="!col.badge">
                                  <span x-text="cellText(row, col)"></span>
                                </template>
                              </td>
                            </template>
                            <td style="text-align: right">
                              <template x-if="canEdit">
                                <span class="a-row-actions">
                                  <template x-if="currentType.manageMembers">
                                    <button class="a-linkbtn" @click="openMembers(row)">Members</button>
                                  </template>
                                  <!-- Locked-control pattern: title on the
                                       wrapper, :disabled on the button. -->
                                  <span class="a-locked" :title="lockHint(currentType)">
                                    <button class="a-linkbtn" :disabled="!entityManaged(currentType)" @click="openEdit(row)">Edit</button>
                                  </span>
                                  <span class="a-locked" :title="lockHint(currentType)">
                                    <button class="a-linkbtn a-linkbtn--danger" :disabled="!entityManaged(currentType)" @click="askDelete(row)">Delete</button>
                                  </span>
                                </span>
                              </template>
                              <template x-if="!canEdit">
                                <span class="a-muted">—</span>
                              </template>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <!-- Create / edit modal -->
                <template x-if="modal.open">
                  <div class="a-scrim" @keydown.escape.window="closeModal()">
                    <div class="a-modal__panel">
                      <h2 class="a-modal__title" x-text="(modal.mode === 'create' ? 'New ' : 'Edit ') + currentType.singular"></h2>
                      <p class="a-caption" style="margin-bottom: 16px">Fields are validated against the API.</p>

                      <template x-if="modal.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="modal.error.code"></span>
                          <span x-text="modal.error.msg"></span>
                        </div>
                      </template>

                      <form @submit.prevent="save()">
                        <template x-for="field in currentType.fields" :key="field.key">
                          <div class="a-field">
                            <label class="a-label" x-text="field.label"></label>

                            <template x-if="field.widget === 'text'">
                              <input
                                class="a-input"
                                :class="field.mono ? 'a-cell-mono' : ''"
                                x-model="modal.form[field.key]"
                                :placeholder="field.placeholder || ''"
                                :disabled="!!(field.lockOnEdit && modal.mode === 'edit')"
                              />
                            </template>

                            <template x-if="field.widget === 'slug'">
                              <input
                                class="a-input"
                                :class="field.mono ? 'a-cell-mono' : ''"
                                :value="modal.form[field.key]"
                                @input="modal.form[field.key] = slugLive($event.target.value)"
                                :placeholder="field.placeholder || ''"
                                :disabled="!!(field.lockOnEdit && modal.mode === 'edit')"
                              />
                            </template>

                            <template x-if="field.widget === 'derived'">
                              <div class="a-derived" :class="field.mono ? 'a-cell-mono' : ''" x-text="derivedValue(field) || '—'"></div>
                            </template>

                            <template x-if="field.widget === 'textarea'">
                              <textarea class="a-textarea" x-model="modal.form[field.key]"></textarea>
                            </template>

                            <template x-if="field.widget === 'scopestrategy'">
                              <div>
                                <select class="a-select" x-model="modal.scopeSel[field.key].strategy">
                                  <template x-for="o in scopeStrategyOptions()" :key="o.value">
                                    <option :value="o.value" x-text="o.label"></option>
                                  </template>
                                </select>
                                <template x-if="scopeNeedsSelection(modal.scopeSel[field.key].strategy)">
                                  <div style="margin-top: 8px">
                                    <label class="a-label">Rule (optional)</label>
                                    <select class="a-select" x-model="modal.scopeSel[field.key].rule">
                                      <option value="">— no rule (use an object id list) —</option>
                                      <template x-for="o in ruleOptions()" :key="o.value">
                                        <option :value="o.value" x-text="o.label"></option>
                                      </template>
                                    </select>
                                    <template x-if="!modal.scopeSel[field.key].rule">
                                      <div style="margin-top: 8px">
                                        <label class="a-label">Object ids</label>
                                        <input
                                          class="a-input a-cell-mono"
                                          x-model="modal.scopeSel[field.key].ids"
                                          placeholder="account:acme/document:42, account:acme/document:99"
                                        />
                                        <p class="a-field__hint" x-text="modal.scopeSel[field.key].strategy === 'exclusive' ? 'Comma-separated object ids to EXCLUDE from the type.' : 'Comma-separated object ids to INCLUDE.'"></p>
                                      </div>
                                    </template>
                                    <p class="a-field__hint" x-show="modal.scopeSel[field.key].rule">Membership is decided per request by the rule.</p>
                                  </div>
                                </template>
                                <p class="a-field__hint">Stored as: <span class="a-cell-mono" x-text="buildScopeRef(modal.scopeSel[field.key]) || '(literal)'"></span></p>
                              </div>
                            </template>

                            <template x-if="field.widget === 'select'">
                              <select class="a-select" x-model="modal.form[field.key]">
                                <template x-for="o in field.options" :key="o">
                                  <option :value="o" x-text="o"></option>
                                </template>
                              </select>
                            </template>

                            <template x-if="field.widget === 'refselect'">
                              <select class="a-select" x-model="modal.form[field.key]">
                                <option value="">Select an option</option>
                                <template x-for="o in refOptions(field)" :key="o.value">
                                  <option :value="o.value" x-text="o.label"></option>
                                </template>
                              </select>
                            </template>

                            <template x-if="field.widget === 'actionselect'">
                              <select class="a-select" x-model="modal.form[field.key]">
                                <option value="">Select an action</option>
                                <template x-for="a in actionOptions()" :key="a">
                                  <option :value="a" x-text="a"></option>
                                </template>
                              </select>
                            </template>

                            <template x-if="field.widget === 'refchecks'">
                              <div class="a-checks">
                                <template x-if="refOptions(field).length === 0">
                                  <span class="a-caption">No options available.</span>
                                </template>
                                <template x-for="o in refOptions(field)" :key="o.value">
                                  <label class="a-check" :class="(modal.form[field.key] || []).includes(o.value) ? 'a-check--on' : ''">
                                    <input type="checkbox" :checked="(modal.form[field.key] || []).includes(o.value)" @change="toggleRef(field.key, o.value)" />
                                    <span class="a-cell-mono" x-text="o.label"></span>
                                  </label>
                                </template>
                              </div>
                            </template>

                            <template x-if="field.widget === 'taglist'">
                              <input
                                class="a-input a-cell-mono"
                                x-model="modal.tagText[field.key]"
                                placeholder="read, write, delete"
                              />
                            </template>

                            <template x-if="field.widget === 'checkbox'">
                              <label class="a-check" :class="modal.form[field.key] ? 'a-check--on' : ''">
                                <input type="checkbox" x-model="modal.form[field.key]" />
                                <span>Delegatable</span>
                              </label>
                            </template>

                            <template x-if="field.hint">
                              <p class="a-field__hint" x-text="field.hint"></p>
                            </template>
                          </div>
                        </template>

                        <template x-if="currentType.membership">
                          <div class="a-field">
                            <label class="a-label">Accounts</label>
                            <template x-if="modal.memberLoading">
                              <span class="a-caption">Loading memberships…</span>
                            </template>
                            <!-- Membership's second, easily-missed entry point:
                                 these boxes are written by save() as a SIDE
                                 EFFECT of saving the principal. Gated on
                                 memberships ALONE (membershipsManaged), never
                                 on the principal's own lock — and save() skips
                                 the reconciliation as well, so a locked
                                 deployment still saves the principal and
                                 touches no edge. The checked state keeps
                                 rendering: the read is not gated. -->
                            <template x-if="!modal.memberLoading">
                              <div class="a-locked a-locked--block" :title="membershipHint()">
                                <div class="a-checks">
                                  <template x-if="accounts.length === 0">
                                    <span class="a-caption">No accounts yet. Create one in the Accounts tab.</span>
                                  </template>
                                  <template x-for="a in accounts" :key="a.ID">
                                    <label class="a-check" :class="modal.memberSel[a.ID] ? 'a-check--on' : ''">
                                      <input type="checkbox" :disabled="!membershipsManaged()" :checked="!!modal.memberSel[a.ID]" @change="toggleModalAccount(a.ID)" />
                                      <span class="a-cell-mono" x-text="a.Name ? (a.ID + ' — ' + a.Name) : a.ID"></span>
                                    </label>
                                  </template>
                                </div>
                              </div>
                            </template>
                            <p class="a-field__hint" x-text="membershipsManaged() ? 'Accounts this principal is a member of. Saved with the principal.' : membershipHint() + ' Shown read-only; saving leaves them unchanged.'"></p>
                          </div>
                        </template>

                        <div class="a-modal__foot">
                          <button type="button" class="a-btn a-btn--secondary" @click="closeModal()">Cancel</button>
                          <button type="submit" class="a-btn a-btn--primary" :disabled="modal.saving" x-text="modal.saving ? 'Saving' : 'Save'"></button>
                        </div>
                      </form>
                    </div>
                  </div>
                </template>

                <!-- Account membership editor -->
                <template x-if="members.open">
                  <div class="a-scrim" @keydown.escape.window="members.open = false">
                    <div class="a-modal__panel">
                      <h2 class="a-modal__title">Members of <span class="a-cell-mono" x-text="members.account.ID"></span></h2>
                      <!-- Membership's first entry point. A locked deployment
                           turns this editor read-only rather than shutting the
                           door: the "Members" action still opens, because who
                           belongs to what is a READ and the read is not gated.
                           Only the checklist and Save go inert, and the caption
                           swaps to the reason instead of an instruction it can
                           no longer honour. -->
                      <p class="a-caption" style="margin-bottom: 16px" x-text="membershipsManaged() ? 'Select the principals that belong to this account.' : membershipHint() + ' This list is read-only.'"></p>

                      <template x-if="members.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="members.error.code"></span>
                          <span x-text="members.error.msg"></span>
                        </div>
                      </template>

                      <template x-if="members.loading">
                        <span class="a-caption">Loading members…</span>
                      </template>

                      <template x-if="!members.loading">
                        <div class="a-field">
                          <div class="a-locked a-locked--block" :title="membershipHint()">
                            <div class="a-checks">
                              <template x-if="refs.principals.length === 0">
                                <span class="a-caption">No principals available.</span>
                              </template>
                              <template x-for="p in refs.principals" :key="p.ID">
                                <label class="a-check" :class="members.selected[p.ID] ? 'a-check--on' : ''">
                                  <input type="checkbox" :disabled="!membershipsManaged()" :checked="!!members.selected[p.ID]" @change="toggleMember(p.ID)" />
                                  <span class="a-cell-mono" x-text="p.Identity ? (p.ID + ' — ' + p.Identity) : p.ID"></span>
                                </label>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>

                      <div class="a-modal__foot">
                        <button type="button" class="a-btn a-btn--secondary" @click="members.open = false" x-text="membershipsManaged() ? 'Cancel' : 'Close'"></button>
                        <span class="a-locked" :title="membershipHint()">
                          <button type="button" class="a-btn a-btn--primary" :disabled="members.saving || members.loading || !membershipsManaged()" @click="saveMembers()" x-text="members.saving ? 'Saving' : 'Save members'"></button>
                        </span>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Delete confirmation (state-of-the-world) -->
                <template x-if="confirm.open">
                  <div class="a-scrim" @keydown.escape.window="confirm.open = false">
                    <div class="a-modal__panel" style="max-width: 460px">
                      <h2 class="a-modal__title">Confirm deletion</h2>
                      <p class="a-body" x-text="confirm.message"></p>
                      <template x-if="confirm.error">
                        <div class="a-alert a-alert--danger" style="margin-top: 16px">
                          <span class="a-alert__code" x-text="confirm.error.code"></span>
                          <span x-text="confirm.error.msg"></span>
                        </div>
                      </template>
                      <div class="a-modal__foot">
                        <button class="a-btn a-btn--secondary" @click="confirm.open = false">Cancel</button>
                        <button class="a-btn a-btn--primary" :disabled="confirm.deleting" @click="doDelete()" x-text="confirm.deleting ? 'Deleting' : 'Delete'"></button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Provisioning (E6-S3): grant management, template apply + bulk, and
               delegation. Its own Alpine scope over the Twirp facade. -->
          <div x-show="active === 'grants'" x-data="grants()">
            <div class="a-section-head">
              <h1 class="a-h3">Grants</h1>
              <span class="a-caption">
                <template x-if="grantAccountFilter">
                  <span>Account <span class="a-mono" x-text="grantAccountFilter"></span></span>
                </template>
                <template x-if="!grantAccountFilter"><span>All accounts</span></template>
              </span>
            </div>

            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to manage grants, templates and delegation.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <template x-if="tierChecked && !canGrant">
                  <div class="a-alert a-alert--info">
                    <span>
                      You are signed in as <span class="a-mono" x-text="principal"></span>.
                      Provisioning grants requires account-admin authority in this account; you
                      have read-only access. Bestowing a delegated subset of your own grants may
                      still be permitted — the server decides.
                    </span>
                  </div>
                </template>

                <div class="a-toolbar">
                  <div class="a-tabs">
                    <template x-for="t in tabs" :key="t.key">
                      <button
                        class="a-tab"
                        :class="{ 'a-tab--active': activeTab === t.key }"
                        @click="selectTab(t.key)"
                        x-text="t.label"
                      ></button>
                    </template>
                  </div>
                  <div class="a-toolbar__spacer"></div>
                  <button class="a-btn a-btn--secondary" @click="loadTab()">Reload</button>
                </div>

                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>

                <template x-if="loading">
                  <p class="a-body a-muted">Loading.</p>
                </template>

                <!-- ============ GRANTS TAB ============ -->
                <div x-show="activeTab === 'grants'">
                  <div class="a-toolbar">
                    <!-- Local account filter (E1-S3): empty = all accounts;
                         choosing an account narrows to it. This is the Grants
                         view's own scope — it does NOT follow the shell switcher. -->
                    <label class="a-field" style="display:flex;align-items:center;gap:8px;margin:0">
                      <span class="a-caption">Account</span>
                      <select class="a-select" style="width:auto" x-model="grantAccountFilter" @change="onGrantAccountFilterChange()">
                        <option value="">All accounts</option>
                        <template x-for="a in accounts" :key="a.ID">
                          <option :value="a.ID" x-text="a.Name ? (a.ID + ' — ' + a.Name) : a.ID"></option>
                        </template>
                      </select>
                    </label>
                    <div class="a-toolbar__spacer"></div>
                    <button class="a-btn a-btn--secondary" @click="addGrantFilter()">Add filter</button>
                    <button class="a-btn a-btn--primary" x-show="canGrant" @click="openCreateGrant()">New grant</button>
                  </div>

                  <div class="a-filterbar" x-show="grantFilters.length > 0">
                    <div class="a-filterbar__match">
                      <span class="a-caption">Match</span>
                      <select class="a-select" style="width:auto" x-model="grantFilterMatch" @change="reloadGrants()">
                        <option value="all">all</option><option value="any">any</option>
                      </select>
                      <span class="a-caption">of:</span>
                    </div>
                    <template x-for="(f, i) in grantFilters" :key="i">
                      <div class="a-filterrow">
                        <select class="a-select" x-model="f.field" @change="reloadGrants()">
                          <template x-for="col in grantCols" :key="col.key"><option :value="col.key" x-text="col.label"></option></template>
                        </select>
                        <select class="a-select" style="width:auto" x-model="f.op" @change="reloadGrants()">
                          <option value="contains">contains</option><option value="eq">equals</option>
                          <option value="starts">starts with</option><option value="empty">is empty</option>
                        </select>
                        <input class="a-input" style="width:150px" x-model="f.value" x-show="filterNeedsValue(f.op)"
                               placeholder="value" @keydown.enter="reloadGrants()" @blur="reloadGrants()" />
                        <button class="a-iconbtn" title="Remove" @click="removeGrantFilter(i)">✕</button>
                      </div>
                    </template>
                    <button class="a-btn a-btn--secondary" @click="addGrantFilter()">+ condition</button>
                    <button class="a-btn a-btn--secondary" @click="clearGrantFilters()">Clear</button>
                  </div>

                  <template x-if="!loading && rows.length === 0">
                    <div class="a-empty">
                      <p class="a-body" x-show="!grantAccountFilter">No grants in any account yet.</p>
                      <p class="a-body" x-show="grantAccountFilter">No grants in this account yet.</p>
                    </div>
                  </template>

                  <template x-if="!loading && rows.length > 0">
                    <div class="a-table-wrap">
                      <table class="a-table">
                        <thead>
                          <tr>
                            <th>Id</th><th>Account</th><th>Subject</th><th>Permission</th><th>Object</th><th>Effect</th><th>Scope strategy</th>
                            <th style="text-align: right">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="g in rows" :key="g.ID">
                            <tr>
                              <td class="a-cell-mono" x-text="g.ID"></td>
                              <td>
                                <template x-if="isWildcardGrant(g)"><span class="a-cell-mono" title="Wildcard account — applies in every account">*</span></template>
                                <template x-if="!isWildcardGrant(g)"><span class="a-cell-mono" x-text="g.AccountID"></span></template>
                              </td>
                              <td class="a-cell-mono" x-text="subjectText(g)"></td>
                              <td class="a-cell-mono" x-text="permLabel(g.PermissionID)"></td>
                              <td class="a-cell-mono" x-text="g.Object"></td>
                              <td><span class="a-badge" :class="'a-badge--' + g.Effect" x-text="g.Effect"></span></td>
                              <td class="a-cell-mono" x-text="permScope(g.PermissionID) || '—'"></td>
                              <td style="text-align: right">
                                <template x-if="isWildcardGrant(g) ? canDefineTemplate : canGrant">
                                  <span class="a-row-actions">
                                    <button class="a-linkbtn" @click="openEditGrant(g)">Edit</button>
                                    <button class="a-linkbtn a-linkbtn--danger" @click="askDeleteGrant(g)">Delete</button>
                                  </span>
                                </template>
                                <template x-if="!(isWildcardGrant(g) ? canDefineTemplate : canGrant)"><span class="a-muted">—</span></template>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>

                  <!-- Pagination bar (E1-S4): count of the account's own grants
                       plus prev/next over its window. In single-account mode the
                       "*" (platform) overlay is an always-included group NOT
                       counted in the total, called out separately when present. -->
                  <div class="a-toolbar" x-show="!loading && page.total > 0">
                    <span class="a-caption">
                      Showing <span x-text="pageStart()"></span>–<span x-text="pageEnd()"></span>
                      of <span x-text="page.total"></span>
                      <span x-show="!grantAccountFilter"> across all accounts</span>
                      <span x-show="grantAccountFilter"> in this account</span>
                      <span class="a-muted" x-show="page.wildcardCount > 0"
                            x-text="'  + ' + page.wildcardCount + ' platform (*) grant' + (page.wildcardCount === 1 ? '' : 's')"></span>
                    </span>
                    <div class="a-toolbar__spacer"></div>
                    <button class="a-btn a-btn--secondary" :disabled="!hasPrev()" @click="prevPage()">Prev</button>
                    <button class="a-btn a-btn--secondary" :disabled="!hasNext()" @click="nextPage()">Next</button>
                  </div>
                </div>

                <!-- ============ TEMPLATES TAB ============ -->
                <div x-show="activeTab === 'templates'">
                  <div class="a-toolbar">
                    <div class="a-toolbar__spacer"></div>
                    <button class="a-btn a-btn--secondary" @click="addTmplFilter()">Add filter</button>
                    <button class="a-btn a-btn--primary" x-show="canDefineTemplate" @click="openCreateTemplate()">New template</button>
                  </div>

                  <div class="a-filterbar" x-show="tmplFilters.length > 0">
                    <div class="a-filterbar__match">
                      <span class="a-caption">Match</span>
                      <select class="a-select" style="width:auto" x-model="tmplFilterMatch" @change="loadTemplates()">
                        <option value="all">all</option><option value="any">any</option>
                      </select>
                      <span class="a-caption">of:</span>
                    </div>
                    <template x-for="(f, i) in tmplFilters" :key="i">
                      <div class="a-filterrow">
                        <select class="a-select" x-model="f.field" @change="loadTemplates()">
                          <template x-for="col in tmplCols" :key="col.key"><option :value="col.key" x-text="col.label"></option></template>
                        </select>
                        <select class="a-select" style="width:auto" x-model="f.op" @change="loadTemplates()">
                          <option value="contains">contains</option><option value="eq">equals</option>
                          <option value="starts">starts with</option><option value="empty">is empty</option>
                        </select>
                        <input class="a-input" style="width:150px" x-model="f.value" x-show="filterNeedsValue(f.op)"
                               placeholder="value" @keydown.enter="loadTemplates()" @blur="loadTemplates()" />
                        <button class="a-iconbtn" title="Remove" @click="removeTmplFilter(i)">✕</button>
                      </div>
                    </template>
                    <button class="a-btn a-btn--secondary" @click="addTmplFilter()">+ condition</button>
                    <button class="a-btn a-btn--secondary" @click="clearTmplFilters()">Clear</button>
                  </div>

                  <template x-if="!loading && templates.length === 0">
                    <div class="a-empty"><p class="a-body">No templates defined yet.</p></div>
                  </template>

                  <template x-if="!loading && templates.length > 0">
                    <div class="a-table-wrap">
                      <table class="a-table">
                        <thead>
                          <tr>
                            <th>Name</th><th>Version</th><th>Parameters</th><th>Grants</th><th>Description</th>
                            <th style="text-align: right">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="t in templates" :key="t.Name + '-v' + t.Version">
                            <tr>
                              <td class="a-cell-mono" x-text="t.Name"></td>
                              <td class="a-cell-mono" x-text="t.Version"></td>
                              <td class="a-cell-mono" x-text="(t.Params || []).map(p => p.Name).join(', ') || '—'"></td>
                              <td x-text="(t.Grants || []).length"></td>
                              <td x-text="t.Description || '—'"></td>
                              <td style="text-align: right">
                                <span class="a-row-actions">
                                  <button class="a-linkbtn" x-show="canGrant" @click="openApply(t, 'single')">Apply</button>
                                  <button class="a-linkbtn" x-show="canGrant" @click="openApply(t, 'bulk')">Bulk apply</button>
                                  <button class="a-linkbtn" x-show="canDefineTemplate" @click="openEditTemplate(t)">Edit</button>
                                  <button class="a-linkbtn a-linkbtn--danger" x-show="canDefineTemplate" @click="askDeleteTemplate(t)">Delete</button>
                                </span>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>

                <!-- ============ DELEGATION TAB ============ -->
                <div x-show="activeTab === 'delegation'">
                  <p class="a-caption" style="margin: 8px 0 12px">
                    Bestowing as <span class="a-mono" x-text="principal"></span>. You may hand a
                    delegatable subset of your own grants to another principal, scoped to
                    <span class="a-mono" x-text="account"></span>. The server enforces the subset,
                    delegatable and may-delegate rules.
                  </p>
                  <template x-if="tierChecked && !hasDelegateRight()">
                    <div class="a-alert a-alert--info">
                      <span>You hold no may-delegate right in this account, so a bestow will be
                        rejected. This is a hint; the server is the source of truth.</span>
                    </div>
                  </template>

                  <template x-if="!loading && eligibleHeld().length === 0">
                    <div class="a-empty">
                      <p class="a-body">You hold no delegatable grants to bestow in this account.</p>
                    </div>
                  </template>

                  <template x-if="!loading && eligibleHeld().length > 0">
                    <div class="a-table-wrap">
                      <table class="a-table">
                        <thead>
                          <tr>
                            <th>Held grant</th><th>Subject</th><th>Permission</th><th>Object</th>
                            <th style="text-align: right">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="g in eligibleHeld()" :key="g.ID">
                            <tr>
                              <td class="a-cell-mono" x-text="g.ID"></td>
                              <td class="a-cell-mono" x-text="subjectText(g)"></td>
                              <td class="a-cell-mono" x-text="permLabel(g.PermissionID)"></td>
                              <td class="a-cell-mono" x-text="g.Object"></td>
                              <td style="text-align: right">
                                <span class="a-row-actions">
                                  <button class="a-linkbtn" @click="openBestow(g)">Bestow subset</button>
                                  <button class="a-linkbtn a-linkbtn--danger" @click="askRevoke(g)">Revoke</button>
                                </span>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>

                <!-- ---- grant create/edit modal ---- -->
                <template x-if="grantModal.open">
                  <div class="a-scrim" @keydown.escape.window="grantModal.open = false">
                    <div class="a-modal__panel">
                      <h2 class="a-modal__title" x-text="(grantModal.mode === 'create' ? 'New grant' : 'Edit grant')"></h2>
                      <p class="a-caption" style="margin-bottom: 16px">
                        Grants are scoped to account <span class="a-mono" x-text="account"></span>. Scope strategy is a
                        property of the referenced permission.
                      </p>
                      <template x-if="grantModal.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="grantModal.error.code"></span>
                          <span x-text="grantModal.error.msg"></span>
                        </div>
                      </template>
                      <form @submit.prevent="saveGrant()">
                        <div class="a-field">
                          <label class="a-label">Grant id</label>
                          <input class="a-input a-cell-mono" x-model="grantModal.form.ID" :disabled="grantModal.mode === 'edit'" placeholder="g-alice-doc" />
                        </div>
                        <div class="a-field">
                          <label class="a-label">Account</label>
                          <select class="a-select" x-model="grantModal.form.AccountID">
                            <option value="">Select an account</option>
                            <option value="*">All accounts (*)</option>
                            <template x-for="a in accounts" :key="a.ID">
                              <option :value="a.ID" x-text="a.Name ? (a.ID + ' — ' + a.Name) : a.ID"></option>
                            </template>
                          </select>
                          <p class="a-field__hint">The account this grant is scoped to. "All accounts (*)" spans every account and requires system-admin.</p>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Subject kind</label>
                          <select class="a-select" x-model="grantModal.form.Subject.Kind">
                            <option value="principal">principal</option>
                            <option value="role">role</option>
                            <option value="group">group</option>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Subject</label>
                          <select class="a-select" x-model="grantModal.form.Subject.ID">
                            <option value="">Select a subject</option>
                            <template x-for="o in subjectOptions(grantModal.form.Subject.Kind)" :key="o.ID">
                              <option :value="o.ID" x-text="o.ID + (o.Name ? ' (' + o.Name + ')' : '')"></option>
                            </template>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Scope strategy filter</label>
                          <select class="a-select" x-model="grantModal.strategyFilter">
                            <template x-for="s in strategyOptions()" :key="s">
                              <option :value="s" x-text="s === '' ? 'Any strategy' : s"></option>
                            </template>
                          </select>
                          <p class="a-field__hint">Narrows the permission list to permissions carrying this scope strategy.</p>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Permission</label>
                          <select class="a-select" x-model="grantModal.form.PermissionID">
                            <option value="">Select a permission</option>
                            <template x-for="p in filteredPermissions()" :key="p.ID">
                              <option :value="p.ID" x-text="permLabel(p.ID)"></option>
                            </template>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Object pattern</label>
                          <input class="a-input a-cell-mono" x-model="grantModal.form.Object" placeholder="account:demo/document:*" />
                        </div>
                        <div class="a-field">
                          <label class="a-label">Effect</label>
                          <select class="a-select" x-model="grantModal.form.Effect">
                            <option value="allow">allow</option>
                            <option value="deny">deny</option>
                          </select>
                        </div>
                        <div class="a-modal__foot">
                          <button type="button" class="a-btn a-btn--secondary" @click="grantModal.open = false">Cancel</button>
                          <button type="submit" class="a-btn a-btn--primary" :disabled="grantModal.saving" x-text="grantModal.saving ? 'Saving' : 'Save'"></button>
                        </div>
                      </form>
                    </div>
                  </div>
                </template>

                <!-- ---- grant delete confirm ---- -->
                <template x-if="confirm.open">
                  <div class="a-scrim" @keydown.escape.window="confirm.open = false">
                    <div class="a-modal__panel" style="max-width: 460px">
                      <h2 class="a-modal__title">Revoke grant</h2>
                      <p class="a-body">Delete grant <span class="a-mono" x-text="confirm.grant.ID"></span> from account <span class="a-mono" x-text="account"></span>?</p>
                      <template x-if="confirm.error">
                        <div class="a-alert a-alert--danger" style="margin-top: 16px">
                          <span class="a-alert__code" x-text="confirm.error.code"></span>
                          <span x-text="confirm.error.msg"></span>
                        </div>
                      </template>
                      <div class="a-modal__foot">
                        <button class="a-btn a-btn--secondary" @click="confirm.open = false">Cancel</button>
                        <button class="a-btn a-btn--primary" :disabled="confirm.saving" @click="doDeleteGrant()" x-text="confirm.saving ? 'Deleting' : 'Delete'"></button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- ---- template editor modal ---- -->
                <template x-if="tmplModal.open">
                  <div class="a-scrim" @keydown.escape.window="tmplModal.open = false">
                    <div class="a-modal__panel" style="max-width: 1080px">
                      <h2 class="a-modal__title" x-text="tmplModal.mode === 'create' ? 'New template' : 'Edit template'"></h2>
                      <p class="a-caption" style="margin-bottom: 16px">
                        Parameters are referenced as <span class="a-mono">${name}</span> in grant subjects and objects.
                      </p>
                      <template x-if="tmplModal.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="tmplModal.error.code"></span>
                          <span x-text="tmplModal.error.msg"></span>
                        </div>
                      </template>
                      <form @submit.prevent="saveTemplate()">
                        <div class="a-field">
                          <label class="a-label">Name</label>
                          <input class="a-input a-cell-mono" x-model="tmplModal.form.Name" :disabled="tmplModal.mode === 'edit'" placeholder="project-member" />
                        </div>
                        <div class="a-field">
                          <label class="a-label">Version</label>
                          <input class="a-input" type="number" min="1" x-model.number="tmplModal.form.Version" />
                        </div>
                        <div class="a-field">
                          <label class="a-label">Description</label>
                          <textarea class="a-textarea" x-model="tmplModal.form.Description"></textarea>
                        </div>

                        <label class="a-label">Parameters</label>
                        <template x-for="(p, i) in tmplModal.form.Params" :key="i">
                          <div class="a-toolbar" style="gap: 8px; margin-bottom: 8px">
                            <input class="a-input a-cell-mono" style="flex: 1" x-model="p.Name" placeholder="name" />
                            <select class="a-select" style="width: auto" x-model="p.Type">
                              <option value="segment">segment</option>
                              <option value="string">string</option>
                            </select>
                            <input class="a-input" style="flex: 1" x-model="p.Description" placeholder="description" />
                            <button type="button" class="a-linkbtn a-linkbtn--danger" @click="removeParam(i)">Remove</button>
                          </div>
                        </template>
                        <button type="button" class="a-btn a-btn--secondary" @click="addParam()" style="margin-bottom: 16px">Add parameter</button>

                        <label class="a-label">Grants</label>
                        <template x-for="(g, i) in tmplModal.form.Grants" :key="i">
                          <div class="a-toolbar" style="gap: 8px; margin-bottom: 8px; flex-wrap: wrap">
                            <select class="a-select" style="width: auto" x-model="g.Subject.Kind">
                              <option value="principal">principal</option>
                              <option value="role">role</option>
                              <option value="group">group</option>
                            </select>
                            <input class="a-input a-cell-mono" style="flex: 1" x-model="g.Subject.ID" placeholder="${who}" />
                            <select class="a-select" style="width: auto" x-model="g.PermissionID">
                              <option value="">permission</option>
                              <template x-for="p in refs.permissions" :key="p.ID">
                                <option :value="p.ID" x-text="p.ID"></option>
                              </template>
                            </select>
                            <input class="a-input a-cell-mono" style="flex: 1" x-model="g.Object" placeholder="account:${account}/document:*" />
                            <select class="a-select" style="width: auto" x-model="g.Effect">
                              <option value="allow">allow</option>
                              <option value="deny">deny</option>
                            </select>
                            <button type="button" class="a-linkbtn a-linkbtn--danger" @click="removeTemplateGrant(i)">Remove</button>
                          </div>
                        </template>
                        <button type="button" class="a-btn a-btn--secondary" @click="addTemplateGrant()">Add grant</button>

                        <div class="a-modal__foot">
                          <button type="button" class="a-btn a-btn--secondary" @click="tmplModal.open = false">Cancel</button>
                          <button type="submit" class="a-btn a-btn--primary" :disabled="tmplModal.saving" x-text="tmplModal.saving ? 'Saving' : 'Save template'"></button>
                        </div>
                      </form>
                    </div>
                  </div>
                </template>

                <!-- ---- template delete confirm ---- -->
                <template x-if="tmplConfirm.open">
                  <div class="a-scrim" @keydown.escape.window="tmplConfirm.open = false">
                    <div class="a-modal__panel" style="max-width: 460px">
                      <h2 class="a-modal__title">Delete template</h2>
                      <p class="a-body">Delete template <span class="a-mono" x-text="tmplConfirm.tmpl.Name"></span> version <span class="a-mono" x-text="tmplConfirm.tmpl.Version"></span>?</p>
                      <template x-if="tmplConfirm.error">
                        <div class="a-alert a-alert--danger" style="margin-top: 16px">
                          <span class="a-alert__code" x-text="tmplConfirm.error.code"></span>
                          <span x-text="tmplConfirm.error.msg"></span>
                        </div>
                      </template>
                      <div class="a-modal__foot">
                        <button class="a-btn a-btn--secondary" @click="tmplConfirm.open = false">Cancel</button>
                        <button class="a-btn a-btn--primary" :disabled="tmplConfirm.saving" @click="doDeleteTemplate()" x-text="tmplConfirm.saving ? 'Deleting' : 'Delete'"></button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- ---- template apply modal (single + bulk, with preview) ---- -->
                <template x-if="apply.open">
                  <div class="a-scrim" @keydown.escape.window="apply.open = false">
                    <div class="a-modal__panel" style="max-width: 1080px">
                      <h2 class="a-modal__title">
                        <span x-text="apply.mode === 'bulk' ? 'Bulk apply template' : 'Apply template'"></span>
                        <span class="a-mono" x-text="apply.name + ' v' + apply.version"></span>
                      </h2>
                      <p class="a-caption" style="margin-bottom: 16px">
                        Fill the parameters, review the expanded grants below, then apply.
                        <span x-show="apply.mode === 'single'">Apply is transactional — all grants land or none do.</span>
                        <span x-show="apply.mode === 'bulk'">Bulk provisioning writes every principal's grants in one atomic operation.</span>
                      </p>
                      <template x-if="apply.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="apply.error.code"></span>
                          <span x-text="apply.error.msg"></span>
                        </div>
                      </template>

                      <template x-if="apply.applied.length > 0">
                        <div class="a-alert a-alert--info">
                          <span>Applied <span x-text="apply.applied.length"></span> grant(s) to account <span class="a-mono" x-text="apply.targetAccount"></span>.</span>
                        </div>
                      </template>

                      <div class="a-field">
                        <label class="a-label">Target account</label>
                        <input class="a-input a-cell-mono" x-model="apply.targetAccount" @input="recomputePreview()" />
                      </div>
                      <div class="a-field">
                        <label class="a-label">Grant id prefix (optional)</label>
                        <input class="a-input a-cell-mono" x-model="apply.prefix" @input="recomputePreview()" :placeholder="apply.name + '-v' + apply.version" />
                      </div>

                      <!-- bulk: pick the per-principal parameter + the principals -->
                      <template x-if="apply.mode === 'bulk'">
                        <div>
                          <div class="a-field">
                            <label class="a-label">Per-principal parameter</label>
                            <select class="a-select" x-model="apply.subjectParam" @change="recomputePreview()">
                              <template x-for="p in (apply.template.Params || [])" :key="p.Name">
                                <option :value="p.Name" x-text="p.Name"></option>
                              </template>
                            </select>
                            <p class="a-field__hint">This parameter is filled with each selected principal's id.</p>
                          </div>
                          <div class="a-field">
                            <label class="a-label">Principals to provision</label>
                            <div class="a-checks">
                              <template x-for="p in refs.principals" :key="p.ID">
                                <label class="a-check" :class="apply.principals.includes(p.ID) ? 'a-check--on' : ''">
                                  <input type="checkbox" :checked="apply.principals.includes(p.ID)" @change="toggleBulkPrincipal(p.ID)" />
                                  <span class="a-cell-mono" x-text="p.ID"></span>
                                </label>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>

                      <!-- the remaining declared parameters -->
                      <template x-for="p in (apply.template.Params || [])" :key="p.Name">
                        <div class="a-field" x-show="!(apply.mode === 'bulk' && p.Name === apply.subjectParam)">
                          <label class="a-label" x-text="p.Name + ' (' + p.Type + ')'"></label>
                          <input class="a-input a-cell-mono" x-model="apply.params[p.Name]" @input="recomputePreview()" :placeholder="p.Description || p.Name" />
                        </div>
                      </template>

                      <label class="a-label" style="margin-top: 12px">Preview — would-be grants</label>
                      <template x-if="apply.preview.length === 0">
                        <p class="a-caption">Fill the parameters to preview the expanded grants.</p>
                      </template>
                      <template x-if="apply.preview.length > 0">
                        <div class="a-table-wrap">
                          <table class="a-table">
                            <thead><tr><th>Id</th><th>Subject</th><th>Permission</th><th>Object</th><th>Effect</th></tr></thead>
                            <tbody>
                              <template x-for="(g, i) in apply.preview" :key="i">
                                <tr>
                                  <td class="a-cell-mono" x-text="g.ID"></td>
                                  <td class="a-cell-mono" x-text="g.Subject.Kind + ':' + g.Subject.ID"></td>
                                  <td class="a-cell-mono" x-text="g.PermissionID"></td>
                                  <td class="a-cell-mono" x-text="g.Object"></td>
                                  <td><span class="a-badge" :class="'a-badge--' + g.Effect" x-text="g.Effect"></span></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </template>

                      <div class="a-modal__foot">
                        <button type="button" class="a-btn a-btn--secondary" @click="apply.open = false">Close</button>
                        <button
                          type="button"
                          class="a-btn a-btn--primary"
                          :disabled="apply.applying || apply.preview.length === 0"
                          @click="applyTemplate()"
                          x-text="apply.applying ? 'Applying' : (apply.mode === 'bulk' ? 'Provision ' + apply.principals.length + ' principal(s)' : 'Apply template')"
                        ></button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- ---- bestow modal ---- -->
                <template x-if="bestow.open">
                  <div class="a-scrim" @keydown.escape.window="bestow.open = false">
                    <div class="a-modal__panel">
                      <h2 class="a-modal__title">Bestow a delegated grant</h2>
                      <p class="a-caption" style="margin-bottom: 16px">
                        You are handing a subset of your own authority to another principal, scoped to
                        account <span class="a-mono" x-text="account"></span>. Narrow the object to a
                        more-specific pattern than the held grant.
                      </p>
                      <template x-if="bestow.error">
                        <div class="a-alert a-alert--danger">
                          <span class="a-alert__code" x-text="bestow.error.code"></span>
                          <span x-text="bestow.error.msg"></span>
                        </div>
                      </template>
                      <form @submit.prevent="doBestow()">
                        <div class="a-field">
                          <label class="a-label">From held grant</label>
                          <select class="a-select" x-model="bestow.selectedHeldId" @change="onSelectHeld()">
                            <option value="">Select one of your delegatable grants</option>
                            <template x-for="g in eligibleHeld()" :key="g.ID">
                              <option :value="g.ID" x-text="g.ID + ' — ' + permLabel(g.PermissionID) + ' over ' + g.Object"></option>
                            </template>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">New grant id</label>
                          <input class="a-input a-cell-mono" x-model="bestow.form.ID" placeholder="g-bob-atlas" />
                        </div>
                        <div class="a-field">
                          <label class="a-label">Grantee kind</label>
                          <select class="a-select" x-model="bestow.form.Subject.Kind">
                            <option value="principal">principal</option>
                            <option value="role">role</option>
                            <option value="group">group</option>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Grantee</label>
                          <select class="a-select" x-model="bestow.form.Subject.ID">
                            <option value="">Select a grantee</option>
                            <template x-for="o in subjectOptions(bestow.form.Subject.Kind)" :key="o.ID">
                              <option :value="o.ID" x-text="o.ID + (o.Name ? ' (' + o.Name + ')' : '')"></option>
                            </template>
                          </select>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Permission</label>
                          <input class="a-input a-cell-mono" :value="permLabel(bestow.form.PermissionID)" disabled />
                          <p class="a-field__hint">Inherited from the held grant — a bestow may only hand on the same permission.</p>
                        </div>
                        <div class="a-field">
                          <label class="a-label">Object pattern</label>
                          <input class="a-input a-cell-mono" x-model="bestow.form.Object" placeholder="account:demo/project:atlas/document:42" />
                        </div>
                        <div class="a-modal__foot">
                          <button type="button" class="a-btn a-btn--secondary" @click="bestow.open = false">Cancel</button>
                          <button type="submit" class="a-btn a-btn--primary" :disabled="bestow.saving" x-text="bestow.saving ? 'Bestowing' : 'Bestow'"></button>
                        </div>
                      </form>
                    </div>
                  </div>
                </template>

                <!-- ---- revoke confirm ---- -->
                <template x-if="revokeConfirm.open">
                  <div class="a-scrim" @keydown.escape.window="revokeConfirm.open = false">
                    <div class="a-modal__panel" style="max-width: 460px">
                      <h2 class="a-modal__title">Revoke delegated grant</h2>
                      <p class="a-body">Revoke grant <span class="a-mono" x-text="revokeConfirm.grant.ID"></span>? Revoke enforces the same authority as bestow.</p>
                      <template x-if="revokeConfirm.error">
                        <div class="a-alert a-alert--danger" style="margin-top: 16px">
                          <span class="a-alert__code" x-text="revokeConfirm.error.code"></span>
                          <span x-text="revokeConfirm.error.msg"></span>
                        </div>
                      </template>
                      <div class="a-modal__foot">
                        <button class="a-btn a-btn--secondary" @click="revokeConfirm.open = false">Cancel</button>
                        <button class="a-btn a-btn--primary" :disabled="revokeConfirm.saving" @click="doRevoke()" x-text="revokeConfirm.saving ? 'Revoking' : 'Revoke'"></button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Graph (E8): a force-directed map of the whole model. Its own Alpine
               scope; the canvas is driven by graph.js's self-contained sim. -->
          <div x-show="active === 'graph'" x-data="graph()">
            <div class="a-section-head">
              <h1 class="a-h3">Graph</h1>
              <span class="a-caption" x-show="ready">
                <span x-text="counts.nodes"></span> nodes ·
                <span x-text="counts.edges"></span> edges
              </span>
            </div>

            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to visualize the model.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>
                <template x-if="loading">
                  <p class="a-body a-muted">Loading model.</p>
                </template>

                <div class="a-graph-toolbar" x-show="ready">
                  <input class="a-input" style="width: 180px" x-model="search" placeholder="Search nodes…" />
                  <select class="a-select" style="width: auto" x-model="accountFilter">
                    <option value="">All accounts</option>
                    <template x-for="a in accountList" :key="a"><option :value="a" x-text="a"></option></template>
                  </select>
                  <span class="a-graph-sep"></span>
                  <label class="a-graph-toggle"><input type="checkbox" x-model="layers.accounts" /> Accounts</label>
                  <label class="a-graph-toggle"><input type="checkbox" x-model="layers.objects" /> Objects</label>
                  <label class="a-graph-toggle"><input type="checkbox" x-model="layers.permissions" /> Permissions</label>
                  <label class="a-graph-toggle"><input type="checkbox" x-model="layers.templates" /> Templates</label>
                  <span class="a-graph-sep"></span>
                  <label class="a-graph-toggle" title="Reachability honors membership enforcement (non-members are fenced out)">
                    <input type="checkbox" x-model="enforcement" /> Enforce membership
                  </label>
                  <span class="a-toolbar__spacer" style="flex:1"></span>
                  <button class="a-btn a-btn--secondary" @click="resetView()">Reset view</button>
                  <button class="a-btn a-btn--secondary" @click="load()">Reload</button>
                </div>

                <div class="a-graph-stage" x-show="ready">
                  <div class="a-graph-canvas-wrap">
                    <canvas x-ref="canvas" class="a-graph-canvas"></canvas>
                    <!-- Legend -->
                    <div class="a-graph-legend">
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#10b981"></span>Principal</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#f59e0b"></span>Role</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#ec4899"></span>Group</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#6366f1"></span>Account</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#38bdf8"></span>Object</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot" style="background:#a78bfa"></span>Permission</div>
                      <div class="a-graph-legend__row"><span class="a-graph-dot a-graph-dot--ring"></span>Wildcard (*)</div>
                      <div class="a-graph-legend__sep"></div>
                      <div class="a-graph-legend__row"><span class="a-graph-line"></span>Allow</div>
                      <div class="a-graph-legend__row"><span class="a-graph-line a-graph-line--dash"></span>Deny</div>
                      <div class="a-graph-legend__row"><span class="a-graph-line a-graph-line--dot"></span>Delegate</div>
                    </div>
                  </div>

                  <!-- Side panel: selected node detail + reachability control. -->
                  <div class="a-graph-panel">
                    <template x-if="!selected">
                      <div class="a-graph-panel__empty">
                        <p class="a-body a-muted">Click a node for detail. Drag to move, scroll to zoom, drag the background to pan.</p>
                        <p class="a-caption">Pick a principal and hit <em>Trace reach</em> to light up everything it can access.</p>
                      </div>
                    </template>
                    <template x-if="selected">
                      <div>
                        <div class="a-graph-panel__head">
                          <span class="a-badge" x-text="selected.type"></span>
                          <h3 class="a-h4" x-text="selected.title" style="margin:4px 0 0"></h3>
                        </div>
                        <dl class="a-graph-kv">
                          <template x-for="row in selected.rows" :key="row[0]">
                            <div class="a-graph-kv__row">
                              <dt x-text="row[0]"></dt>
                              <dd class="a-mono" style="white-space:pre-wrap" x-text="row[1]"></dd>
                            </div>
                          </template>
                        </dl>
                        <div class="a-graph-panel__actions" x-show="selected.canReach">
