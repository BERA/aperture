                          <button class="a-btn a-btn--primary" @click="focusReach()" x-show="reachId !== 'principal ' + selected.id">Trace reach</button>
                          <button class="a-btn a-btn--secondary" @click="clearReach()" x-show="reachId">Clear trace</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Audit viewer (E6-S4): a read-only queryable table over the append-
               only audit trail. Its own Alpine scope over the Twirp facade. -->
          <div x-show="active === 'audit'" x-data="audit()">
            <div class="a-section-head">
              <h1 class="a-h3">Audit</h1>
              <span class="a-caption" x-show="account">
                Account <span class="a-mono" x-text="account"></span>
              </span>
            </div>

            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to query the audit trail.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <template x-if="tierChecked && !canRead">
                  <div class="a-alert a-alert--info">
                    <span>
                      You are signed in as <span class="a-mono" x-text="principal"></span>.
                      Reading the audit trail requires system-admin authority (the whole trail) or
                      account-admin authority (this account only); you have neither, so the trail is
                      empty for you.
                    </span>
                  </div>
                </template>
                <template x-if="tierChecked && !canReadAll && canReadAccount">
                  <div class="a-alert a-alert--info">
                    <span>
                      As an account-admin you see only events scoped to account
                      <span class="a-mono" x-text="account"></span>.
                    </span>
                  </div>
                </template>

                <div class="a-toolbar" style="flex-wrap: wrap; gap: 8px">
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Actor</label>
                    <input class="a-input a-cell-mono" style="width: 160px" x-model="filter.actor" placeholder="principal id" @keydown.enter="load()" />
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Event type</label>
                    <select class="a-select" style="width: auto" x-model="filter.eventType">
                      <option value="">All</option>
                      <template x-for="t in eventTypes" :key="t"><option :value="t" x-text="t"></option></template>
                    </select>
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Outcome</label>
                    <select class="a-select" style="width: auto" x-model="filter.outcome">
                      <option value="">All</option>
                      <template x-for="o in outcomes" :key="o"><option :value="o" x-text="o"></option></template>
                    </select>
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Since</label>
                    <input class="a-input" type="datetime-local" x-model="filter.since" />
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Until</label>
                    <input class="a-input" type="datetime-local" x-model="filter.until" />
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Limit</label>
                    <input class="a-input" type="number" min="1" style="width: 90px" x-model.number="filter.limit" />
                  </div>
                  <div class="a-toolbar__spacer"></div>
                  <template x-if="accounts.length > 1">
                    <select class="a-select" style="width: auto" x-model="account" @change="onAccountChange()">
                      <template x-for="a in accounts" :key="a.ID">
                        <option :value="a.ID" x-text="a.Name || a.ID"></option>
                      </template>
                    </select>
                  </template>
                  <button class="a-btn a-btn--secondary" @click="resetFilter()">Reset</button>
                  <button class="a-btn a-btn--primary" @click="load()">Query</button>
                </div>

                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>

                <template x-if="loading">
                  <p class="a-body a-muted">Loading.</p>
                </template>

                <template x-if="!loading && !error && rows.length === 0">
                  <div class="a-empty"><p class="a-body">No audit events match this query.</p></div>
                </template>

                <template x-if="!loading && rows.length > 0">
                  <div class="a-table-wrap">
                    <table class="a-table">
                      <thead>
                        <tr>
                          <th>Time</th><th>Type</th><th>Action</th><th>Actor (real)</th>
                          <th>Effective subject</th><th>Account</th><th>Target</th><th>Outcome</th><th>Reason</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="ev in rows" :key="ev.ID">
                          <tr>
                            <td class="a-cell-mono" x-text="when(ev)"></td>
                            <td><span class="a-badge" x-text="ev.EventType"></span></td>
                            <td class="a-cell-mono" x-text="dash(ev.Action)"></td>
                            <td class="a-cell-mono" x-text="dash(ev.Actor)"></td>
                            <td class="a-cell-mono" x-text="effectiveText(ev)"></td>
                            <td class="a-cell-mono" x-text="dash(ev.Account)"></td>
                            <td class="a-cell-mono" x-text="dash(ev.Target)"></td>
                            <td><span class="a-badge" :class="outcomeClass(ev)" x-text="ev.Outcome"></span></td>
                            <td x-text="dash(ev.Reason)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- What-if simulator (E6-S4): a read-only decision against the LIVE
               model plus its full Explain trace. Its own Alpine scope. -->
          <div x-show="active === 'whatif'" x-data="whatif()">
            <div class="a-section-head">
              <h1 class="a-h3">What-if</h1>
              <span class="a-caption" x-show="account">
                Account <span class="a-mono" x-text="account"></span>
              </span>
            </div>

            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to simulate a decision.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <p class="a-caption" style="margin: 0 0 12px">
                  Ask whether a principal would be allowed an action on an object, against the live
                  model. This runs Check and Explain — read-only, no mutation.
                </p>

                <div class="a-toolbar" style="flex-wrap: wrap; gap: 8px; align-items: flex-end">
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Principal</label>
                    <input class="a-input a-cell-mono" style="width: 160px" x-model="form.principal" placeholder="alice" @keydown.enter="run()" />
                  </div>
                  <div class="a-field" style="margin: 0">
                    <label class="a-label">Action</label>
                    <input class="a-input a-cell-mono" style="width: 160px" x-model="form.action" placeholder="read" @keydown.enter="run()" />
                  </div>
                  <div class="a-field" style="margin: 0; flex: 1; min-width: 240px">
                    <label class="a-label">Object</label>
                    <input class="a-input a-cell-mono" x-model="form.object" placeholder="account:demo/document:42" @keydown.enter="run()" />
                  </div>
                  <template x-if="accounts.length > 1">
                    <div class="a-field" style="margin: 0">
                      <label class="a-label">Account</label>
                      <select class="a-select" style="width: auto" x-model="account">
                        <template x-for="a in accounts" :key="a.ID">
                          <option :value="a.ID" x-text="a.Name || a.ID"></option>
                        </template>
                      </select>
                    </div>
                  </template>
                  <button class="a-btn a-btn--primary" :disabled="running" @click="run()" x-text="running ? 'Running' : 'Simulate'"></button>
                </div>

                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>

                <!-- verdict -->
                <template x-if="ran && decision">
                  <div class="a-alert" :class="decision.allow ? 'a-alert--success' : 'a-alert--danger'" style="margin-top: 16px">
                    <span class="a-alert__code" x-text="decision.allow ? 'ALLOW' : 'DENY'"></span>
                    <span x-text="decision.reason"></span>
                  </div>
                </template>

                <template x-if="ran && decidingIds().length > 0">
                  <p class="a-caption" style="margin-top: 8px">
                    Deciding grants:
                    <template x-for="(id, i) in decidingIds()" :key="id">
                      <span><span class="a-mono" x-text="id"></span><span x-show="i < decidingIds().length - 1">, </span></span>
                    </template>
                  </p>
                </template>

                <!-- trace -->
                <template x-if="ran && trace">
                  <div style="margin-top: 20px">
                    <div class="a-section-head" style="margin-bottom: 8px">
                      <h2 class="a-h4">Explain trace</h2>
                      <span class="a-caption">Max specificity <span class="a-mono" x-text="trace.MaxSpecificity"></span></span>
                    </div>

                    <p class="a-caption" style="margin-bottom: 8px">
                      Expanded subject set:
                      <template x-for="(s, i) in subjects()" :key="i">
                        <span><span class="a-mono" x-text="subjectText(s)"></span><span x-show="i < subjects().length - 1">, </span></span>
                      </template>
                      <span x-show="subjects().length === 0" class="a-muted">none</span>
                    </p>

                    <template x-if="considered().length === 0">
                      <div class="a-empty"><p class="a-body">No grants were considered for this subject set.</p></div>
                    </template>

                    <template x-if="considered().length > 0">
                      <div class="a-table-wrap">
                        <table class="a-table">
                          <thead>
                            <tr>
                              <th>Grant</th><th>Subject</th><th>Permission</th><th>Effect</th><th>Object pattern</th>
                              <th>Action</th><th>Strategy</th><th>Action match</th><th>Covered</th><th>Specificity</th>
                              <th>Deciding</th><th>Outcome</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(g, i) in considered()" :key="g.GrantID + '-' + i">
                              <tr :class="g.Deciding ? 'a-row--active' : ''">
                                <td class="a-cell-mono" x-text="dash(g.GrantID)"></td>
                                <td class="a-cell-mono" x-text="subjectText(g.Subject)"></td>
                                <td class="a-cell-mono" x-text="dash(g.PermissionID)"></td>
                                <td><span class="a-badge" :class="'a-badge--' + g.Effect" x-text="g.Effect"></span></td>
                                <td class="a-cell-mono" x-text="dash(g.ObjectPattern)"></td>
                                <td class="a-cell-mono" x-text="dash(g.Action)"></td>
                                <td class="a-cell-mono" x-text="dash(g.Strategy)"></td>
                                <td x-text="yesno(g.ActionMatched)"></td>
                                <td x-text="yesno(g.Covered)"></td>
                                <td class="a-cell-mono" x-text="g.Specificity"></td>
                                <td x-text="yesno(g.Deciding)"></td>
                                <td x-text="dash(g.Outcome)"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Import / export (E6-S4): download the declarative model file, or
               upload one with a preview diff before applying. Own Alpine scope. -->
          <div x-show="active === 'portability'" x-data="portability()">
            <div class="a-section-head">
              <h1 class="a-h3">Import / export</h1>
              <span class="a-caption" x-show="account">
                Account <span class="a-mono" x-text="account"></span>
              </span>
            </div>

            <template x-if="!principal">
              <div class="a-empty">
                <p class="a-body">Sign in to export or import the model.</p>
              </div>
            </template>

            <template x-if="principal">
              <div>
                <template x-if="tierChecked && !canManage">
                  <div class="a-alert a-alert--info">
                    <span>
                      You are signed in as <span class="a-mono" x-text="principal"></span>.
                      Exporting and importing the declarative model requires system-admin authority.
                      The server is the source of truth and will reject an unauthorised action.
                    </span>
                  </div>
                </template>

                <template x-if="error">
                  <div class="a-alert a-alert--danger">
                    <span class="a-alert__code" x-text="error.code"></span>
                    <span x-text="error.msg"></span>
                  </div>
                </template>

                <!-- EXPORT -->
                <div class="a-card" style="margin-bottom: 20px">
                  <h2 class="a-h4">Export</h2>
                  <p class="a-caption" style="margin: 4px 0 12px">
                    Download the whole model — every RBAC entity, grants, templates and rules — as one
                    canonical JSON document. Live host object metadata is deliberately excluded.
                  </p>
                  <button class="a-btn a-btn--primary" :disabled="loading" @click="exportModel()" x-text="loading ? 'Working' : 'Export model'"></button>
                  <template x-if="exportSummary.length > 0">
                    <div class="a-table-wrap" style="margin-top: 12px">
                      <table class="a-table">
                        <thead><tr><th>Collection</th><th style="text-align: right">Count</th></tr></thead>
                        <tbody>
                          <template x-for="s in exportSummary" :key="s.label">
                            <tr><td x-text="s.label"></td><td class="a-cell-mono" style="text-align: right" x-text="s.count"></td></tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>

                <!-- IMPORT -->
                <div class="a-card">
                  <h2 class="a-h4">Import</h2>
                  <p class="a-caption" style="margin: 4px 0 12px">
                    Upload a declarative model file. Import is an idempotent, transactional upsert — it
                    adds or updates every entity in the file and never deletes. Review the preview diff
                    below, then apply.
                  </p>
                  <input class="a-input" type="file" accept="application/json,.json" @change="onFile($event)" />

                  <template x-if="importError">
                    <div class="a-alert a-alert--danger" style="margin-top: 12px">
                      <span class="a-alert__code" x-text="importError.code"></span>
                      <span x-text="importError.msg"></span>
                    </div>
                  </template>

                  <template x-if="importDone">
                    <div class="a-alert a-alert--success" style="margin-top: 12px">
                      <span class="a-alert__code">APPLIED</span>
                      <span>Import applied. The preview is now empty because the model matches the file.</span>
                    </div>
                  </template>

                  <!-- preview diff -->
                  <template x-if="diff">
                    <div style="margin-top: 16px">
                      <p class="a-body">
                        Preview for <span class="a-mono" x-text="importFile"></span>:
                        <span class="a-badge a-badge--allow" x-text="diff.totalAdded + ' to add'"></span>
                        <span class="a-badge" x-text="diff.totalChanged + ' to change'"></span>
                      </p>
                      <template x-if="diff.empty">
                        <p class="a-caption">No changes — the uploaded file matches the current model (import would be a no-op).</p>
                      </template>

                      <template x-for="grp in diff.groups" :key="grp.key">
                        <div x-show="grp.added.length > 0 || grp.changed.length > 0" style="margin-top: 12px">
                          <label class="a-label" x-text="grp.label"></label>
                          <div class="a-table-wrap">
                            <table class="a-table">
                              <thead><tr><th>Change</th><th>Key</th></tr></thead>
                              <tbody>
                                <template x-for="a in grp.added" :key="'a-' + a.key">
                                  <tr><td><span class="a-badge a-badge--allow">add</span></td><td class="a-cell-mono" x-text="a.key"></td></tr>
                                </template>
                                <template x-for="c in grp.changed" :key="'c-' + c.key">
                                  <tr><td><span class="a-badge a-badge--deny">change</span></td><td class="a-cell-mono" x-text="c.key"></td></tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                          <p class="a-caption" x-show="grp.retained > 0" style="margin-top: 4px">
                            <span class="a-mono" x-text="grp.retained"></span> existing entr(ies) not in the file are retained (import never deletes).
                          </p>
                        </div>
                      </template>

                      <div class="a-modal__foot" style="margin-top: 16px">
                        <button class="a-btn a-btn--secondary" @click="resetImport()">Clear</button>
                        <button class="a-btn a-btn--primary" :disabled="importing || diff.empty" @click="applyImport()" x-text="importing ? 'Applying' : 'Apply import'"></button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Rules (E7-S2): the Blueprints-style node editor over the E2-S3
               pulse-expression rule AST. The palette adds AST nodes; typed
               sockets wire them; the canvas pans/zooms/reroutes. The graph is
               serialized to and from the exact rules.Node JSON by the pure
               serializer (js/rules-serializer.js) — there is no second format.
               window.blueprintEditor exposes toAST/fromAST/validate for E7-S3. -->
          <template x-if="active === 'rules'">
            <div x-data="rules()">
              <div class="a-section-head">
                <h1 class="a-h3">Rules</h1>
                <span class="a-caption">Node editor · pulse-expression AST</span>
              </div>
              <p class="a-caption" style="margin: 0 0 12px">
                Build a rule as a graph of nodes over object metadata and the
                principal, account and action context. The graph serializes to
                the same rule AST the engine evaluates and the state file
                persists — the editor is a view over that one format. Structural
                checks run here as you edit; full type-checking runs on the
                server when you save (<span class="a-mono">E7-S3</span>).
              </p>

              <template x-if="error">
                <div class="a-alert a-alert--danger">
                  <span class="a-alert__code">RULE</span>
                  <span x-text="error"></span>
                </div>
              </template>

              <!-- Load / save / validate toolbar. Editing is SYSTEM tier: the Save
                   button is shown only to a system-admin (canEdit, probed via the
                   open Check RPC); a non-admin still loads, validates and previews.
                   Server validation and save surface their APERTURE_* code + msg. -->
              <div class="a-card" style="padding: 12px; margin-bottom: 12px">
                <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end">
                  <div class="a-field">
                    <label class="a-label" for="rule-name">Rule name</label>
                    <input class="a-input a-mono" id="rule-name" type="text" autocomplete="off"
                           placeholder="quarantine-rule" x-model="ruleName" />
                  </div>
                  <div class="a-field">
                    <label class="a-label" for="rule-load">Load existing</label>
                    <select class="a-input" id="rule-load" @change="loadRule($event.target.value); $event.target.value=''">
                      <option value="">Select a rule…</option>
                      <template x-for="r in ruleList" :key="r.Name">
                        <option :value="r.Name" x-text="r.Name"></option>
                      </template>
                    </select>
                  </div>
                  <div style="display: flex; gap: 8px">
                    <button type="button" class="a-btn a-btn--secondary"
                            @click="serverValidate()" :disabled="validating || booting"
                            x-text="validating ? 'Validating…' : 'Validate'"></button>
                    <button type="button" class="a-btn a-btn--primary"
                            x-show="canEdit" @click="save()" :disabled="saving || booting"
                            x-text="saving ? 'Saving…' : 'Save'"></button>
                  </div>
                </div>
                <div class="a-field" style="margin-top: 12px">
                  <label class="a-label" for="rule-desc">Description</label>
                  <input class="a-input" id="rule-desc" type="text" autocomplete="off"
                         placeholder="Optional documentation" x-model="description" />
                </div>
                <p class="a-caption" x-show="tierChecked && !canEdit" style="margin: 8px 0 0">
                  You are signed in as a non-admin: you can load, validate and preview
                  rules, but saving requires system-admin authority.
                </p>
                <template x-if="status">
                  <div class="a-alert" :class="status.kind === 'ok' ? 'a-alert--success' : 'a-alert--danger'"
                       style="margin-top: 12px">
                    <span class="a-alert__code" x-text="status.code || (status.kind === 'ok' ? 'OK' : 'RULE')"></span>
                    <span x-text="status.msg"></span>
                  </div>
                </template>
              </div>

              <div class="a-rule-editor" style="display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: start">
                <!-- Palette -->
                <div class="a-card" style="padding: 12px">
                  <p class="a-label" style="margin-bottom: 8px">Palette</p>
                  <template x-for="grp in palette" :key="grp.group">
                    <div style="margin-bottom: 12px">
                      <p class="a-caption" style="margin: 0 0 6px" x-text="grp.group"></p>
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <template x-for="item in grp.items" :key="item.kind">
                          <button
                            type="button"
                            class="a-btn a-btn--secondary"
                            style="justify-content: flex-start"
                            @click="add(item.kind)"
                            x-text="item.label"
                          ></button>
                        </template>
                      </div>
                    </div>
                  </template>
                  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px; border-top: 1px solid var(--color-border); padding-top: 12px">
                    <button type="button" class="a-btn a-btn--secondary" @click="zoomToFit()">Fit to view</button>
                    <button type="button" class="a-btn a-btn--secondary" @click="clearCanvas()">Clear canvas</button>
                  </div>
                </div>

                <!-- Canvas + validation -->
                <div>
                  <div class="a-card" style="padding: 0; overflow: hidden">
                    <div
                      x-ref="canvas"
                      class="rete-canvas"
                      style="position: relative; width: 100%; height: 480px; background: var(--color-surface-2)"
                    >
                      <template x-if="booting">
                        <p class="a-caption" style="padding: 16px">Loading the canvas.</p>
                      </template>
                    </div>
                  </div>

                  <!-- Inline structural validation (client-side; AST shape + unknown
                       variable roots). Full validation is the engine's, in E7-S3. -->
                  <div style="margin-top: 12px">
                    <template x-if="!booting && valid">
                      <p class="a-caption" style="margin: 0; color: var(--color-success, var(--neutral-700))">
                        The rule is structurally valid. Server validation runs on save.
                      </p>
                    </template>
                    <template x-if="!booting && !valid && problems.length">
                      <div class="a-card" style="padding: 12px">
                        <p class="a-label" style="margin-bottom: 8px">Validation</p>
                        <ul style="margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px">
                          <template x-for="(p, i) in problems" :key="i">
                            <li class="a-caption">
                              <span class="a-mono" x-text="p.code"></span>
                              <span x-text="' · ' + p.path + ' — ' + p.message"></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                  </div>

                  <!-- Object what-if preview (READ-ONLY). Evaluates the rule
                       CURRENTLY on the canvas against a sample object's provider
                       metadata and shows the boolean result. No account /
                       principal / grant — the rule reads only object.*, so the
                       author sees it fire (or not) directly. Nothing is saved. -->
                  <div class="a-card" style="padding: 12px; margin-top: 12px">
                    <p class="a-label" style="margin-bottom: 4px">Object what-if preview</p>
                    <p class="a-caption" style="margin: 0 0 12px">
                      Read-only. Pick an object type and a sample object; the rule on
                      the canvas is evaluated against that object's data — without saving.
                    </p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end">
                      <div class="a-field">
                        <label class="a-label" for="rule-wi-type">Object type</label>
                        <select class="a-input" id="rule-wi-type"
                                x-model="preview.objectType" @change="loadPreviewObjects()">
                          <option value="">Select a type…</option>
                          <template x-for="t in objectTypes" :key="t">
                            <option :value="t" x-text="t"></option>
                          </template>
                        </select>
                      </div>
                      <div class="a-field">
                        <label class="a-label" for="rule-wi-object">Object</label>
                        <select class="a-input a-mono" id="rule-wi-object"
                                x-model="preview.objectId" :disabled="!preview.objects.length">
                          <option value="">Select an object…</option>
                          <template x-for="o in preview.objects" :key="o">
                            <option :value="o" x-text="o"></option>
                          </template>
                        </select>
                      </div>
                      <button type="button" class="a-btn a-btn--secondary"
                              @click="runPreview()" :disabled="previewing || booting || !preview.objectId"
                              x-text="previewing ? 'Running…' : 'Evaluate'"></button>
                    </div>

                    <template x-if="previewError">
                      <div class="a-alert a-alert--danger" style="margin-top: 12px">
                        <span class="a-alert__code" x-text="previewError.code"></span>
                        <span x-text="previewError.msg"></span>
                      </div>
                    </template>

                    <template x-if="previewResult !== null">
                      <div style="margin-top: 12px">
                        <p class="a-caption" style="margin: 0 0 4px">
                          Rule result for <span class="a-mono" x-text="preview.objectId"></span>:
                          <strong x-text="previewResult ? 'true (selected)' : 'false (not selected)'"
                                  :style="previewResult ? 'color: var(--color-success, var(--neutral-700))' : 'color: var(--color-danger, var(--neutral-700))'"></strong>
                        </p>

                        <!-- Deny-safe notes. A rule can evaluate to false
                             because the object does not match, or because a
                             stored value could not be read as a date at all —
                             and those need different fixes. The engine records
                             the second as a note; a bare false with no
                             explanation is how an access-control bug hides. -->
                        <template x-if="previewNotes.length">
                          <div class="a-alert a-alert--info" style="margin-top: 8px; display: block">
                            <p class="a-label" style="margin-bottom: 4px">Why this evaluated the way it did</p>
                            <template x-for="n in previewNotes" :key="n.key">
                              <p class="a-caption" style="margin: 2px 0">
                                <span class="a-mono" x-text="n.kind"></span>
                                <span x-text="' · ' + n.message"></span>
                              </p>
                            </template>
                          </div>
                        </template>

                        <!-- Resolved relative-date bounds. A relative date is a
                             computation, so the author is shown what it BECAME
                             for this evaluation, next to the reference instant
                             it was computed from.

                             Every value here is printed VERBATIM, exactly as
                             the server sent it, `Z` included. It is never put
                             through a JS Date: a viewer in UTC-5 would then read
                             a resolved 2026-01-01T00:00:00Z as 2025-12-31, a
                             different calendar year from the one the rule
                             compares against. -->
                        <template x-if="previewBounds.length">
                          <div style="margin-top: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-2); padding: 8px">
                            <p class="a-label" style="margin-bottom: 2px">Relative dates, as resolved for this evaluation</p>
                            <p class="a-caption" style="margin: 0 0 6px">
                              Reference instant (UTC): <span class="a-mono" x-text="previewNow"></span>
                            </p>
                            <template x-for="b in previewBounds" :key="b.key">
                              <div style="display: flex; align-items: baseline; gap: 8px; padding: 2px 0; flex-wrap: wrap">
                                <span class="a-caption a-mono" style="flex: none" x-text="b.path"></span>
                                <span class="a-caption" style="flex: none" x-text="b.describe"></span>
                                <span class="a-caption" style="flex: none">=</span>
                                <template x-if="!b.unresolved">
                                  <span class="a-badge a-mono" x-text="b.resolved"></span>
                                </template>
                                <template x-if="b.unresolved">
                                  <span class="a-caption" style="color: var(--color-danger, var(--neutral-700))">
                                    does not resolve — the comparison denies
                                  </span>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                        <!-- The metadata snapshot the rule actually saw, as a
                             field list. Array values expand to one chip per
                             element and object values to indented member rows
                             (the value model caps nesting at 2, so a member row
                             is as deep as it goes). A field NOT listed here was
                             absent from the object — distinct from an empty list
                             ([]) or an empty object ({}), which do get a row.
                             Strictly read-only: no input, and no request path by
                             which the client could supply metadata. -->
                        <template x-if="previewObject">
                          <div style="margin-top: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-2); padding: 8px; max-height: 240px; overflow: auto">
                            <p class="a-label" style="margin-bottom: 6px">Object metadata the rule saw</p>
                            <template x-if="previewRows.length === 0">
                              <p class="a-caption" style="margin: 0">This object carries no metadata fields.</p>
                            </template>
                            <template x-for="r in previewRows" :key="r.key">
                              <div :style="'padding-left: ' + (r.depth * 14) + 'px'">
                                <div style="display: flex; align-items: baseline; gap: 8px; padding: 2px 0">
                                  <span class="a-caption a-mono" style="flex: none; color: var(--color-fg)" x-text="r.label"></span>
                                  <span class="a-caption" style="flex: none">=</span>
                                  <div style="flex: 1; min-width: 0">
                                    <!-- Scalar: unchanged rendering — the JSON form, so a
                                         string keeps its quotes. -->
                                    <template x-if="r.kind === 'scalar'">
                                      <span class="a-caption a-mono" style="display: block; overflow-x: auto; white-space: pre; color: var(--color-fg)"
                                            x-text="r.text"></span>
                                    </template>
                                    <!-- Non-empty array: one chip per element, wrapping so a
                                         long list grows downward inside the panel. -->
                                    <template x-if="r.kind === 'array' && r.items.length > 0">
                                      <span style="display: flex; flex-wrap: wrap; gap: 4px">
                                        <template x-for="(item, i) in r.items" :key="i">
                                          <span class="a-badge a-mono" style="max-width: 100%; overflow-x: auto; white-space: pre" x-text="item"></span>
                                        </template>
                                      </span>
                                    </template>
                                    <!-- Empty array / object header: the literal [] or {} (or
                                         {…} when members follow below). -->
                                    <template x-if="r.kind === 'object' || (r.kind === 'array' && r.items.length === 0)">
                                      <span class="a-caption a-mono" style="color: var(--color-fg)" x-text="r.text"></span>
                                    </template>
                                  </div>
                                  <span class="a-caption" style="flex: none" x-text="r.note"></span>
                                </div>
                              </div>
                            </template>
                            <details style="margin-top: 8px">
                              <summary class="a-caption" style="cursor: pointer">Raw JSON</summary>
                              <pre class="a-caption a-mono" style="margin: 4px 0 0; overflow-x: auto"
                                   x-text="JSON.stringify(previewObject, null, 2)"></pre>
                            </details>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </main>
      </div>

      <!-- Sign-in affordance: shown when no dev bearer is present. Auth is
           external — this only names which principal the dev session presents. -->
      <template x-if="!signedIn">
        <div class="a-scrim">
          <form class="a-signin" @submit.prevent="signIn()">
            <h2 class="a-signin__title">Sign in</h2>
            <p class="a-signin__hint">
              Aperture consumes external credentials; it never issues them. For
              local and demo use the dev authenticator, where the bearer is the
              principal id. Enter a principal id to continue.
            </p>
            <label class="a-label" for="signin-id">Principal id</label>
            <input
              class="a-input"
              id="signin-id"
              type="text"
              autocomplete="off"
              placeholder="alice"
              x-model="signInId"
            />
            <div class="a-signin__row">
              <button class="a-btn a-btn--primary" type="submit">Continue</button>
            </div>
          </form>
        </div>
      </template>
    </div>
  </body>
</html>
